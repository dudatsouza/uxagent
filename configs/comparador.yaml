# Comparador: adulto de 30 a 50 anos, sem experiência em configurar automação (usuário "normal"). Fase II, Seç. III.
nome: comparador
persona_id: comparador-v1
grupo: C
ficha: ficha_comparador.txt
congelado: false
mecanismos: {M1: true, M2: true, M3: true, M4: true, M5: true, M6: true}
parametros:
  p_atr:  {tipo: uniforme, min: 0.1, max: 0.5}
  q_rot:  {tipo: uniforme, min: 0.0, max: 0.3}
  p_slip: {tipo: uniforme, min: 0.005, max: 0.05}
  p_hes:  {tipo: uniforme, min: 0.0, max: 0.4}
  r_nota: {tipo: fixo, valor: 1.0}
  c_comp: {tipo: uniforme, min: 0.8, max: 1.0}
llm:
  modelo: claude-sonnet-5-5
  effort: low
  max_tokens: 4000
  fallbacks: default
  max_retries: 2
